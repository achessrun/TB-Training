<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — New Staff Audit Training</title>
<meta name="description" content="Classify trial balance accounts to the correct audit lead schedule.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <header class="sheet-head">
    <div>
      <h1 class="entity">Classify<br>the account</h1>
      <p class="period">Training &middot; Year ended 6/30/2026 &middot; Part 2 of 2</p>
    </div>
    <div class="index-box">
      <span class="ref">TB-2</span>
      <span class="by">Prep <b>NEW</b></span>
      <span class="by">Rev <b>&mdash;</b></span>
    </div>
  </header>

  <main id="stage"></main>

</div>

<script src="tb-data.js"></script>
<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var CATS = CATEGORIES.map(function (c) { return c.key; });
  var CATNAME = {};
  var CATWHY = {};
  CATEGORIES.forEach(function (c) {
    CATNAME[c.key] = c.name;
    CATWHY[c.key] = c.why;
  });

  var state = null;

  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };

  var money = function (n) {
    if (n === 0) return "\u2014";
    var s = Math.abs(n).toLocaleString("en-US");
    return n < 0 ? "(" + s + ")" : s;
  };

  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  /* The revised trial balance resolved the classifications that were
     previously disputable, so every account is fair game. */
  var POOL = ACCOUNTS.slice();

  /* Categories that are easy to confuse with each other. Distractors are
     drawn from here first so the wrong answers are actually tempting. */
  var CONFUSABLE = {
    "Cash": ["Cash/Investments", "Prepaid", "Net Assets"],
    "Cash/Investments": ["Cash", "Revenue", "Capital Assets"],
    "Prepaid": ["Expense", "Cash", "Capital Assets"],
    "Revenue": ["Expense", "Net Assets", "Cash/Investments"],
    "Expense": ["Payroll", "Revenue", "Debt"],
    "Payroll": ["Expense", "Net Assets", "Debt"],
    "Net Assets": ["Revenue", "Cash", "Debt"],
    "Capital Assets": ["Expense", "Debt", "Prepaid"],
    "Debt": ["Expense", "Capital Assets", "Net Assets"]
  };

  function buildClassify(a) {
    var wrong = shuffle((CONFUSABLE[a.cls] || []).filter(function (c) { return c !== a.cls; }));
    var pool = shuffle(CATS.filter(function (c) {
      return c !== a.cls && wrong.indexOf(c) === -1;
    }));
    var picks = wrong.concat(pool).slice(0, 3);
    var opts = shuffle(picks.concat([a.cls]));

    // The classification rationale is the teaching moment, so it is what
    // gets shown after the answer regardless of right or wrong.
    var why = a.why || (CATNAME[a.cls] + ": " + CATWHY[a.cls].split(". ")[0] + ".");

    return {
      kind: "classify",
      stem: a.name,
      meta: "Account <b>" + a.acct + "</b> &middot; row " + a.row +
            " &middot; adjusted balance " + money(a.cy) + " &middot; which lead schedule?",
      options: opts.map(function (c) { return CATNAME[c]; }),
      answer: opts.indexOf(a.cls),
      why: why
    };
  }

  function buildReasoning(r) {
    var idx = r.options.map(function (o, i) { return i; });
    var order = shuffle(idx);
    return {
      kind: "reasoning",
      stem: r.q,
      meta: "Why the grouping works this way",
      options: order.map(function (i) { return r.options[i]; }),
      answer: order.indexOf(r.a),
      why: r.why
    };
  }

  /* A flat random draw would be 55% Expense accounts, since that is how the
     trial balance is shaped. Trainees would learn to guess "Expense" and
     score well without understanding anything. So sample round-robin across
     categories instead: every area gets roughly equal airtime, which means
     the small ones with distinctive treatment — Prepaid, Debt, Net Assets —
     actually show up. */
  function drawAccounts(n) {
    var buckets = {};
    POOL.forEach(function (a) {
      (buckets[a.cls] = buckets[a.cls] || []).push(a);
    });
    Object.keys(buckets).forEach(function (k) {
      buckets[k] = shuffle(buckets[k]);
    });

    var picked = [];
    var order = shuffle(Object.keys(buckets));
    var exhausted = false;

    while (picked.length < n && !exhausted) {
      exhausted = true;
      for (var i = 0; i < order.length && picked.length < n; i++) {
        var b = buckets[order[i]];
        if (b.length) { picked.push(b.pop()); exhausted = false; }
      }
      order = shuffle(order);
    }
    return picked;
  }

  function makeSet(n) {
    // Roughly one reasoning question in four, spread through the run rather
    // than arriving in a block at the end.
    var nReason = Math.min(REASONING.length, Math.max(2, Math.round(n / 4)));
    var nClass = n - nReason;

    var qs = drawAccounts(nClass).map(buildClassify)
      .concat(shuffle(REASONING).slice(0, nReason).map(buildReasoning));

    return shuffle(qs);
  }

  /* ---------------- screens ---------------- */

  function renderSetup() {
    stage.innerHTML =
      '<p class="lede">Accounts are drawn at random from the trial balance, so no two ' +
      'attempts are the same. Nothing is saved &mdash; close the tab and it resets.</p>' +
      '<div class="setup">' +
      '<h3 class="sub">How many questions?</h3>' +
      '<div class="opt-grid">' +
      len(10, "Quick pass", "about three minutes") +
      len(20, "Standard", "the one to use for sign-off") +
      len(40, "Full run", "covers most of the trial balance") +
      "</div></div>";

    Array.prototype.forEach.call(stage.querySelectorAll("[data-n]"), function (b) {
      b.addEventListener("click", function () {
        start(parseInt(b.getAttribute("data-n"), 10));
      });
    });
  }

  function len(n, label, sub) {
    return '<button class="choice" data-n="' + n + '">' +
           '<span class="kx">' + n + "</span><b>" + label + "</b> &mdash; " +
           '<span style="color:var(--muted)">' + sub + "</span></button>";
  }

  function start(n) {
    state = { qs: makeSet(n), i: 0, score: 0, missed: [] };
    renderQuestion();
  }

  function renderQuestion() {
    var q = state.qs[state.i];
    var pct = Math.round((state.i / state.qs.length) * 100);

    stage.innerHTML =
      '<div class="progress"><span>' + (state.i + 1) + " / " + state.qs.length + "</span>" +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
      "<span>" + state.score + " correct</span></div>" +
      '<div class="qcard">' +
      '<h2 class="qstem">' + esc(q.stem) + "</h2>" +
      '<p class="qmeta">' + q.meta + "</p>" +
      '<div class="opt-grid" id="opts">' +
      q.options.map(function (o, i) {
        return '<button class="choice" data-i="' + i + '">' +
               '<span class="kx">' + "ABCD".charAt(i) + "</span>" + esc(o) + "</button>";
      }).join("") +
      '</div><div id="fb"></div></div>';

    Array.prototype.forEach.call(stage.querySelectorAll("[data-i]"), function (b) {
      b.addEventListener("click", function () {
        answer(parseInt(b.getAttribute("data-i"), 10));
      });
    });
  }

  function answer(pick) {
    var q = state.qs[state.i];
    var right = pick === q.answer;
    if (right) state.score++;
    else state.missed.push({ q: q.stem, correct: q.options[q.answer], why: q.why });

    Array.prototype.forEach.call(stage.querySelectorAll("[data-i]"), function (b) {
      var i = parseInt(b.getAttribute("data-i"), 10);
      b.disabled = true;
      if (i === q.answer) b.classList.add("right");
      else if (i === pick) b.classList.add("wrong");
    });

    var last = state.i === state.qs.length - 1;
    document.getElementById("fb").innerHTML =
      '<div class="verdict ' + (right ? "ok" : "no") + '">' +
      '<p class="vh">' + (right ? "Correct" : "Correct answer: " + esc(q.options[q.answer])) + "</p>" +
      "<p>" + esc(q.why) + "</p></div>" +
      '<div class="controls"><button class="btn" id="next">' +
      (last ? "See results" : "Next question") + "</button></div>";

    var btn = document.getElementById("next");
    btn.addEventListener("click", function () {
      if (last) { renderResults(); }
      else { state.i++; renderQuestion(); }
    });
    btn.focus();
  }

  function renderResults() {
    var n = state.qs.length;
    var pct = Math.round((state.score / n) * 100);
    var verdict =
      pct >= 90 ? "Solid. You can read this trial balance without help." :
      pct >= 75 ? "Close. Reread the schedules behind the ones you missed." :
      "Work through Part 1 again before your first engagement.";

    var h = '<p class="eyebrow">Result</p>' +
            '<div class="score">' + pct + "<span>%</span></div>" +
            '<p class="lede" style="margin-top:0.6rem">' + state.score + " of " + n +
            " correct. " + verdict + "</p>";

    if (state.missed.length) {
      h += '<div class="missed"><h3 class="sub">What to review</h3><ul>' +
        state.missed.map(function (m) {
          return "<li><span class=\"mq\">" + esc(m.q) + "</span>" +
                 '<span class="ma">Correct answer: <b>' + esc(m.correct) + "</b>. " +
                 esc(m.why) + "</span></li>";
        }).join("") + "</ul></div>";
    }

    h += '<div class="controls">' +
         '<button class="btn" id="again">Take it again</button>' +
         '<a class="btn ghost" href="index.html">Back to the trial balance</a></div>';

    stage.innerHTML = h;
    document.getElementById("again").addEventListener("click", renderSetup);
    window.scrollTo(0, 0);
  }

  renderSetup();
})();
</script>
</body>
</html>
